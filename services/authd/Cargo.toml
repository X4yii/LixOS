[package]
name = "authd"
version = "0.0.2"
edition = "2021"
description = "Authentication daemon and capability delegator for LixOS"

[dependencies]
lix-sys = { path = "../../libs/lix-sys" }
sys-libc = { path = "../../libs/sys-libc" }
linked_list_allocator = "0.10.5"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
aes-gcm-siv = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
subtle = { version = "2.6", default-features = false }

[[bin]]
name = "authd"
path = "src/main.rs"
test = false

[lints]
workspace = true

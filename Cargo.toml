[workspace]
resolver = "2"

members = [
    "xtask",
    "kernel",
    "libs/lix-sys",
    "libs/lix-storage",
    "libs/lix-net",
    "libs/lix-wifi",
    "libs/lix-bluetooth",
    "libs/lix-usb",
    "libs/sys-libc",
    "libs/lix-edit",
    "services/authd",
    "services/netmgr",
    "services/bluetoothd",
    "services/lix-compositor",
    "userland/vanish",
    "userland/edit",
    "pkg/pml",
    "tools/lix-installer",
    "tools/lix-mkiso",
    "userland/ltop",
    "userland/lixinstall",
]

[workspace.package]
version = "0.0.2"
license = "GPL-2.0-only"
edition = "2024"
rust-version = "1.85.0"
exclude = []
categories = ["command-line-interface"]
keywords = ["terminal"]

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
panic = "abort"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1
panic = "abort"
[workspace.dependencies]
anstyle = "1.0.3"
bitflags = "2.11"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
compact_str = { version = "0.10", default-features = false }
criterion = { version = "0.8", features = ["html_reports"] }
critical-section = "1.2"
crossterm = "0.29"
document-features = "0.2.11"
hashbrown = "0.17"
indoc = "2.0.5"
instability = "0.3.7"
itertools = { version = "0.15", default-features = false, features = ["use_alloc"] }
kasuari = { version = "0.4.9", default-features = false }
line-clipping = "0.3.8"
lru = "0.18"
palette = { version = "0.7.7", default-features = false, features = ["libm"] }
portable-atomic-util = { version = "0.2.4", default-features = false }
pretty_assertions = "1"
rand = "0.10"
rand_chacha = "0.10"
litui = { path = "libs/litui/litui", version = "0.30.2" }
litui-core = { path = "libs/litui/litui-core", version = "0.1.2" }
litui-widgets = { path = "libs/litui/litui-widgets", version = "0.3.2" }
rstest = "0.27"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.142"
strum = { version = "0.28", default-features = false, features = ["derive"] }
termina = "0.4"
termion = "4"
termwiz = "0.23"
thiserror = { version = "2.0.12", default-features = false }
time = { version = "0.3.37", default-features = false }
tokio = "1.35"
tokio-stream = "0.1"
tracing = "0.1.37"
tracing-appender = "0.2"
tracing-subscriber = "0.3.10"
trybuild = "1.0.19"
unicode-segmentation = "1.9"
unicode-truncate = { version = "3", default-features = false }
unicode-width = ">=0.2.0"

[workspace.lints.rust]
unsafe_code = "deny"
unfulfilled_lint_expectations = "allow"
unused_parens = "allow"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
similar_names = "allow"
unreadable_literal = "allow"
inline_always = "allow"
ptr_as_ptr = "allow"
as_ptr_cast_mut = "allow"
wildcard_imports = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
used_underscore_binding = "allow"
no_effect_underscore_binding = "allow"
needless_range_loop = "allow"
needless_continue = "allow"
single_match = "allow"
single_match_else = "allow"
collapsible_if = "allow"
match_same_arms = "allow"
redundant_else = "allow"
map_unwrap_or = "allow"
manual_range_contains = "allow"
wrong_self_convention = "allow"
uninlined_format_args = "allow"
return_self_not_must_use = "allow"
unused_self = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
redundant_closure_for_method_calls = "allow"
map_err_ignore = "allow"
else_if_without_else = "allow"
as_underscore = "allow"
mod_module_files = "allow"
deref_by_slicing = "allow"
format_push_string = "allow"
string_slice = "allow"
needless_raw_strings = "allow"
manual_checked_ops = "allow"
missing_const_for_fn = "allow"
use_self = "allow"
chunks_exact_to_as_chunks = "allow"
incompatible_msrv = "allow"
empty_loop = "allow"
needless_else = "allow"
new_without_default = "allow"
double_parens = "allow"
identity_op = "allow"
question_mark = "allow"
ptr_arg = "allow"
explicit_counter_loop = "allow"
manual_is_ascii_check = "allow"
unnecessary_sort_by = "allow"
fn_to_numeric_cast_any = "allow"
result_unit_err = "allow"
unnecessary_cast = "allow"
unnecessary_map_or = "allow"
manual_flatten = "allow"
or_fun_call = "allow"
needless_pass_by_ref_mut = "allow"
redundant_guards = "allow"
precedence = "allow"
int_plus_one = "allow"
manual_clamp = "allow"
while_let_loop = "allow"
new_ret_no_self = "allow"

empty_line_after_doc_comments = "warn"
equatable_if_let = "warn"
implicit_clone = "warn"
mixed_read_write_in_expression = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_lit_chars_any = "warn"
unnecessary_self_imports = "warn"

[profile.bench]
codegen-units = 1
lto = true

[workspace]
resolver = "2"

members = [
    "xtask",
    "kernel",
    "libs/lix-sys",
    "libs/sys-libc",
    "libs/lix-ui",
    "services/authd",
    "services/lix-compositor",
    "userland/vanish",
    "userland/lix-shell",
    "pkg/pml",
    "tools/lix-installer",
    "tools/lix-mkiso",
    "userland/ltop",
]

[workspace.package]
version = "0.0.1"
license = "MIT"
edition = "2024"
rust-version = "1.85.0"
exclude = []
categories = ["command-line-interface"]
keywords = ["terminal"]

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
panic = "abort"

[profile.release]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1
panic = "abort"
[workspace.dependencies]
anstyle = "1.0.3"
bitflags = "2.11"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
compact_str = { version = "0.10", default-features = false }
criterion = { version = "0.8", features = ["html_reports"] }
critical-section = "1.2"
crossterm = "0.29"
document-features = "0.2.11"
fakeit = "1"
hashbrown = "0.17"
indoc = "2.0.5"
instability = "0.3.7"
itertools = { version = "0.15", default-features = false, features = ["use_alloc"] }
kasuari = { version = "0.4.9", default-features = false }
line-clipping = "0.3.8"
lru = "0.18"
octocrab = "0.54"
palette = { version = "0.7.7", default-features = false, features = ["libm"] }
portable-atomic-util = { version = "0.2.4", default-features = false }
pretty_assertions = "1"
rand = "0.10"
rand_chacha = "0.10"
litui = { path = "libs/litui/litui", version = "0.30.2" }
litui-core = { path = "libs/litui/litui-core", version = "0.1.2" }
litui-widgets = { path = "libs/litui/litui-widgets", version = "0.3.2" }
rstest = "0.27"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.142"
strum = { version = "0.28", default-features = false, features = ["derive"] }
termina = "0.4"
termion = "4"
termwiz = "0.23"
thiserror = { version = "2.0.12", default-features = false }
time = { version = "0.3.37", default-features = false }
tokio = "1.35"
tokio-stream = "0.1"
tracing = "0.1.37"
tracing-appender = "0.2"
tracing-subscriber = "0.3.10"
trybuild = "1.0.19"
unicode-segmentation = "1.9"
unicode-truncate = { version = "3", default-features = false }
# See <https://github.com/litui/litui/issues/1271> for information about why we pin unicode-width
unicode-width = ">=0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
pedantic = { level = "warn", priority = -1 }

# we often split up a module into multiple files with the main type in a file named after the
# module, so we want to allow this pattern
module_inception = "allow"

# nursery or restricted
as_underscore = "warn"
deref_by_slicing = "warn"
else_if_without_else = "warn"
empty_line_after_doc_comments = "warn"
equatable_if_let = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
implicit_clone = "warn"
map_err_ignore = "warn"
missing_const_for_fn = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
needless_pass_by_ref_mut = "warn"
needless_raw_strings = "warn"
or_fun_call = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
unnecessary_self_imports = "warn"
use_self = "warn"

# Improve benchmark consistency
[profile.bench]
codegen-units = 1
lto = true

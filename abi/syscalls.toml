
[abi]
version = "0.1.0"
arch = "x86_64"
calling_convention = "sysv_registers"

[[syscall]]
id = 0x000
name = "sys_abi_version"
description = "Devuelve (major << 16 | minor) del ABI del kernel"
args = []
rights = "NONE"

[[syscall]]
id = 0x001
name = "sys_handle_close"
description = "Cierra un handle y libera el objeto si no quedan referencias"
args = [{ name = "handle", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x002
name = "sys_handle_dup"
description = "Duplica un handle atenuando sus derechos"
args = [{ name = "handle", type = "u64" }, { name = "rights", type = "u32" }]
rights = "DUP"

[[syscall]]
id = 0x007
name = "sys_revoker_create"
description = "Crea un objeto de revocación activa"
args = []
rights = "NONE"

[[syscall]]
id = 0x008
name = "sys_revoker_revoke"
description = "Invalida todos los handles y memoria virtual ligados al revoker"
args = [{ name = "rev_handle", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x100
name = "sys_process_spawn"
description = "Crea y arranca un proceso en un Job determinado"
args = [{ name = "spec_ptr", type = "u64" }]
rights = "SPAWN"

[[syscall]]
id = 0x101
name = "sys_process_exit"
description = "Termina el proceso actual con código de estado"
args = [{ name = "code", type = "i32" }]
rights = "NONE"

[[syscall]]
id = 0x200
name = "sys_vmo_create"
description = "Crea un objeto de memoria anónima"
args = [{ name = "size", type = "u64" }, { name = "flags", type = "u32" }]
rights = "NONE"

[[syscall]]
id = 0x202
name = "sys_vm_map"
description = "Mapea un VMO en el espacio virtual con contabilidad estricta"
args = [
    { name = "vmo_h", type = "u64" },
    { name = "addr_hint", type = "u64" },
    { name = "len", type = "u64" },
    { name = "prot", type = "u32" },
    { name = "flags", type = "u32" }
]
rights = "MAP"

[[syscall]]
id = 0x700
name = "sys_display_info"
description = "Consulta modos y resolución del display lix-drm"
args = [{ name = "display_h", type = "u64" }, { name = "info_ptr", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x702
name = "sys_display_present"
description = "Presenta un VMO en pantalla con vblank synchronization"
args = [
    { name = "display_h", type = "u64" },
    { name = "vmo_h", type = "u64" },
    { name = "rects_ptr", type = "u64" },
    { name = "rects_count", type = "u32" }
]
rights = "DISPLAY_OWN"

[[syscall]]
id = 0x801
name = "sys_log_write"
description = "Escribe texto en el búfer circular klog"
args = [{ name = "buf_ptr", type = "u64" }, { name = "len", type = "u64" }]
rights = "LOG"
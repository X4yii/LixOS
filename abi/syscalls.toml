
[abi]
version = "0.1.0"
arch = "x86_64"
calling_convention = "sysv_registers"

[[syscall]]
id = 0x000
name = "sys_abi_version"
description = "Devuelve (major << 16 | minor) del ABI del kernel"
args = []
rights = "NONE"

[[syscall]]
id = 0x001
name = "sys_handle_close"
description = "Cierra un handle y libera el objeto si no quedan referencias"
args = [{ name = "handle", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x002
name = "sys_handle_dup"
description = "Duplica un handle atenuando sus derechos"
args = [{ name = "handle", type = "u64" }, { name = "rights", type = "u32" }]
rights = "DUP"

[[syscall]]
id = 0x003
name = "sys_handle_dup2"
description = "Duplica un handle hacia un índice de descriptor específico"
args = [{ name = "src_handle", type = "u64" }, { name = "dst_idx", type = "u64" }]
rights = "DUP"

[[syscall]]
id = 0x100
name = "sys_process_spawn"
description = "Crea y arranca un proceso en un Job determinado"
args = [{ name = "spec_ptr", type = "u64" }]
rights = "SPAWN"

[[syscall]]
id = 0x101
name = "sys_process_exit"
description = "Termina el proceso actual con código de estado"
args = [{ name = "code", type = "i32" }]
rights = "NONE"

[[syscall]]
id = 0x102
name = "sys_process_kill"
description = "Envía una señal POSIX a un proceso (hijo propio, uno mismo, o con derecho MANAGE)"
args = [{ name = "pid", type = "u64" }, { name = "signal", type = "u32" }]
rights = "NONE"

[[syscall]]
id = 0x107
name = "sys_sleep"
description = "Bloquea el proceso actual durante un número de milisegundos"
args = [{ name = "ms", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x10A
name = "sys_waitpid"
description = "Espera a la terminación de un proceso hijo concreto (hijo propio o con derecho MANAGE)"
args = [{ name = "pid", type = "u64" }, { name = "status_ptr", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x10C
name = "sys_process_list"
description = "Enumera los procesos del sistema hacia un búfer de usuario"
args = [{ name = "buffer", type = "u64" }, { name = "max_count", type = "u64" }]
rights = "INSPECT"

[[syscall]]
id = 0x200
name = "sys_mmap"
description = "Mapea memoria virtual anónima para el proceso"
args = [{ name = "addr", type = "u64" }, { name = "len", type = "u64" }, { name = "prot", type = "u64" }, { name = "flags", type = "u64" }]
rights = "MAP"

[[syscall]]
id = 0x201
name = "sys_munmap"
description = "Desmapea un rango de memoria virtual del proceso"
args = [{ name = "addr", type = "u64" }, { name = "len", type = "u64" }]
rights = "MAP"

[[syscall]]
id = 0x300
name = "sys_open"
description = "Abre un archivo devolviendo un descriptor/handle"
args = [{ name = "path_ptr", type = "u64" }, { name = "path_len", type = "u64" }, { name = "flags", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x301
name = "sys_read"
description = "Lee bytes desde un handle hacia un búfer de usuario"
args = [{ name = "handle", type = "u64" }, { name = "buf_ptr", type = "u64" }, { name = "len", type = "u64" }]
rights = "READ"

[[syscall]]
id = 0x302
name = "sys_write"
description = "Escribe bytes desde un búfer de usuario hacia un handle"
args = [{ name = "handle", type = "u64" }, { name = "buf_ptr", type = "u64" }, { name = "len", type = "u64" }]
rights = "WRITE"

[[syscall]]
id = 0x303
name = "sys_lseek"
description = "Reposiciona el cursor de un descriptor de archivo"
args = [{ name = "handle", type = "u64" }, { name = "offset", type = "i64" }, { name = "whence", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x306
name = "sys_list_dir"
description = "Enumera las entradas de un directorio hacia un búfer de usuario"
args = [{ name = "path_ptr", type = "u64" }, { name = "path_len", type = "u64" }, { name = "out_ptr", type = "u64" }, { name = "out_len", type = "u64" }]
rights = "READ"

[[syscall]]
id = 0x307
name = "sys_read_file"
description = "Lee el contenido completo de un archivo hacia un búfer de usuario"
args = [{ name = "path_ptr", type = "u64" }, { name = "path_len", type = "u64" }, { name = "out_ptr", type = "u64" }, { name = "out_len", type = "u64" }]
rights = "READ"

[[syscall]]
id = 0x308
name = "sys_write_file"
description = "Sobrescribe un archivo con el contenido de un búfer de usuario"
args = [{ name = "path_ptr", type = "u64" }, { name = "path_len", type = "u64" }, { name = "data_ptr", type = "u64" }, { name = "data_len", type = "u64" }]
rights = "WRITE"

[[syscall]]
id = 0x309
name = "sys_read_nonblocking"
description = "Lee bytes disponibles sin bloquear el proceso"
args = [{ name = "handle", type = "u64" }, { name = "buf_ptr", type = "u64" }, { name = "len", type = "u64" }]
rights = "READ"

[[syscall]]
id = 0x30A
name = "sys_remove_file"
description = "Elimina un archivo o directorio recursivo del sistema de archivos"
args = [{ name = "path_ptr", type = "u64" }, { name = "path_len", type = "u64" }, { name = "recursive", type = "u64" }]
rights = "WRITE"

[[syscall]]
id = 0x30B
name = "sys_mkdir"
description = "Crea un directorio en el sistema de archivos"
args = [{ name = "path_ptr", type = "u64" }, { name = "path_len", type = "u64" }]
rights = "WRITE"

[[syscall]]
id = 0x400
name = "sys_channel_create"
description = "Crea un par de extremos de canal IPC bidireccional"
args = [{ name = "out_handles_ptr", type = "u64" }]
rights = "TRANSFER"

[[syscall]]
id = 0x401
name = "sys_channel_send"
description = "Envía datos y transfiere handles a través de un canal"
args = [{ name = "handle", type = "u64" }, { name = "data_ptr", type = "u64" }, { name = "data_len", type = "u64" }, { name = "handles_ptr", type = "u64" }, { name = "handles_len", type = "u64" }]
rights = "WRITE"

[[syscall]]
id = 0x402
name = "sys_channel_recv"
description = "Recibe datos y handles transferidos desde un canal"
args = [{ name = "handle", type = "u64" }, { name = "data_ptr", type = "u64" }, { name = "max_data_len", type = "u64" }, { name = "handles_ptr", type = "u64" }, { name = "max_handles_len", type = "u64" }]
rights = "READ"

[[syscall]]
id = 0x703
name = "sys_terminal_info"
description = "Consulta dimensiones y escala geométrica de la terminal activa"
args = [{ name = "info_ptr", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x704
name = "sys_terminal_set_scale"
description = "Ajusta la escala tipográfica o zoom de la terminal"
args = [{ name = "command", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x705
name = "sys_input_open"
description = "Abre un flujo de eventos físicos de entrada"
args = [{ name = "class", type = "u32" }]
rights = "INPUT_READ"

[[syscall]]
id = 0x706
name = "sys_set_keymap"
description = "Configura la distribución activa del teclado PS/2"
args = [{ name = "layout_id", type = "u8" }]
rights = "DEVICES"

[[syscall]]
id = 0x707
name = "sys_get_keymap"
description = "Consulta la distribución activa del teclado PS/2"
args = []
rights = "NONE"

[[syscall]]
id = 0x801
name = "sys_log_write"
description = "Escribe texto en el búfer circular klog"
args = [{ name = "buf_ptr", type = "u64" }, { name = "len", type = "u64" }]
rights = "LOG"

[[syscall]]
id = 0x803
name = "sys_power"
description = "Apagado y reinicio ordenado de la máquina"
args = [{ name = "cmd", type = "u64" }]
rights = "POWER"

[[syscall]]
id = 0x80A
name = "sys_monitor_metrics"
description = "Consulta telemetría del sistema (RAM, CPU ticks, métricas de E/S)"
args = [{ name = "metrics_ptr", type = "u64" }]
rights = "INSPECT"

[[syscall]]
id = 0x820
name = "sys_block_open"
description = "Adquiere un lease exclusivo sobre un dispositivo de bloques físico"
args = [{ name = "device_index", type = "u64" }, { name = "flags", type = "u64" }]
rights = "DEVICES"

[[syscall]]
id = 0x821
name = "sys_block_info"
description = "Consulta geometría y tamaño de bloque lógico del dispositivo"
args = [{ name = "handle", type = "u64" }, { name = "info_ptr", type = "u64" }]
rights = "READ"

[[syscall]]
id = 0x822
name = "sys_block_read"
description = "Lee bloques lógicos contiguos desde almacenamiento físico"
args = [
    { name = "handle", type = "u64" },
    { name = "start_block", type = "u64" },
    { name = "block_count", type = "u16" },
    { name = "buf_ptr", type = "u64" }
]
rights = "READ"

[[syscall]]
id = 0x823
name = "sys_block_write"
description = "Escribe bloques lógicos contiguos a almacenamiento físico"
args = [
    { name = "handle", type = "u64" },
    { name = "start_block", type = "u64" },
    { name = "block_count", type = "u16" },
    { name = "buf_ptr", type = "u64" }
]
rights = "WRITE"

[[syscall]]
id = 0x824
name = "sys_block_sync"
description = "Ejecuta Flush en la controladora para garantizar persistencia no volátil"
args = [{ name = "handle", type = "u64" }]
rights = "WRITE"

[[syscall]]
id = 0x825
name = "sys_usb_enumerate"
description = "Enumera los dispositivos USB detectados"
args = [{ name = "buffer", type = "u64" }, { name = "capacity", type = "u32" }]
rights = "ENUMERATE"

[[syscall]]
id = 0x830
name = "sys_socket_open"
description = "Crea un handle de socket UDP IPv4 no bloqueante"
args = []
rights = "NET_CONNECT"

[[syscall]]
id = 0x831
name = "sys_socket_bind"
description = "Asocia un socket UDP a un puerto local IPv4"
args = [{ name = "socket", type = "u64" }, { name = "port", type = "u16" }]
rights = "WRITE"

[[syscall]]
id = 0x832
name = "sys_socket_sendto"
description = "Envía un datagrama UDP IPv4"
args = [{ name = "socket", type = "u64" }, { name = "address_ptr", type = "u64" }, { name = "data_ptr", type = "u64" }, { name = "length", type = "u64" }]
rights = "WRITE"

[[syscall]]
id = 0x833
name = "sys_socket_recvfrom"
description = "Recibe un datagrama UDP IPv4 sin bloquear"
args = [{ name = "socket", type = "u64" }, { name = "data_ptr", type = "u64" }, { name = "capacity", type = "u64" }, { name = "address_ptr", type = "u64" }]
rights = "READ"


[[syscall]]
id = 0x600
name = "sys_io_uring_setup"
description = "Create an io_uring instance"
args = [{ name = "entries", type = "u32" }]
rights = "NONE"

[[syscall]]
id = 0x601
name = "sys_io_uring_submit"
description = "Submit an SQE to the ring"
args = [{ name = "handle", type = "u64" }, { name = "op", type = "u8" }, { name = "arg1", type = "u64" }, { name = "arg2", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x602
name = "sys_io_uring_enter"
description = "Wait for at least one completion"
args = [{ name = "handle", type = "u64" }]
rights = "NONE"

[[syscall]]
id = 0x603
name = "sys_io_uring_peek"
description = "Peek a completion event"
args = [{ name = "handle", type = "u64" }, { name = "user_ptr", type = "u64" }]
rights = "NONE"
